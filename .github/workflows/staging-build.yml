name: Dialer Staging

on:
  push:
    branches: [ lineage-24.0 ]
  pull_request:
    branches: [ lineage-24.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Dialer calls hidden framework methods absent from the public SDK
      # stubs (see gradle/tools/PatchHiddenApis.java). Inject compile-only
      # stubs into the runner's android.jar; skips anything already present.
      - name: Patch hidden framework APIs into android.jar
        run: |
          mkdir -p /tmp/dialer-ci-asm /tmp/dialer-ci-patcher
          curl -sL -o /tmp/dialer-ci-asm/asm.jar \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar
          javac -cp /tmp/dialer-ci-asm/asm.jar -d /tmp/dialer-ci-patcher \
            gradle/tools/PatchHiddenApis.java
          java -cp /tmp/dialer-ci-patcher:/tmp/dialer-ci-asm/asm.jar PatchHiddenApis \
            "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p ./artifacts
          cp $(find . -type f -path "*build/outputs/apk/debug/*.apk" | head -1) ./artifacts/MaxxOS-Dialer.apk
          ls -la ./artifacts

      - name: Publish APK to rolling staging release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view staging >/dev/null 2>&1 || gh release create staging --title "Staging build" --notes "Latest staging APK (direct .apk download, no zip)." --prerelease
          gh release upload staging ./artifacts/MaxxOS-Dialer.apk --clobber
